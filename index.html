<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Francis le Coq — Eggsponential</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg1:#0d0520; --bg2:#1a0840;
  --gold:#FFD700; --purple:#c084fc; --purple-d:#6d28d9;
  --green-l:#a3e635; --orange-l:#fcd34d; --cyan:#0ea5e9;
  --txt:#fff; --muted:#c9aaee;
}
html,body{height:100%}
body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2)); background-attachment:fixed;
  font-family:'Fredoka One',cursive; color:var(--txt); min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom)); overflow-x:hidden;
}
body::before{
  content:''; position:fixed; top:-120px; left:50%; transform:translateX(-50%);
  width:380px; height:380px; border-radius:50%;
  background:radial-gradient(circle,rgba(120,40,200,0.35),transparent 70%);
  pointer-events:none; z-index:0;
}
.app{width:100%; max-width:420px; position:relative; z-index:1; display:flex; flex-direction:column; align-items:center}

/* HEADER */
.brand{display:flex; flex-direction:column; align-items:center; margin-bottom:14px; margin-top:4px}
.brand img{width:110px; height:110px; object-fit:contain; filter:drop-shadow(0 6px 18px rgba(0,0,0,0.6)); animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
.brand h1{
  font-family:'Bangers',cursive; font-size:34px; letter-spacing:3px; color:var(--gold);
  text-shadow:0 0 22px rgba(255,215,0,0.55),0 3px 0 rgba(0,0,0,0.35);
  margin-top:4px; line-height:1; text-align:center;
}
.brand .tagline{font-size:11px; color:var(--muted); letter-spacing:1px; margin-top:3px}

/* CARD */
.card{
  width:100%;
  background:linear-gradient(145deg,rgba(13,5,32,0.95),rgba(30,10,65,0.95));
  border:2px solid rgba(180,100,255,0.30); border-radius:24px; padding:22px 18px;
  box-shadow:0 0 50px rgba(120,40,200,0.35);
}
body.playing{padding:0; justify-content:flex-start}
body.playing .brand{display:none}
body.playing #screenGame.card{
  border:none; border-radius:0; box-shadow:none; background:transparent;
  padding:10px 10px calc(14px + env(safe-area-inset-bottom));
  min-height:100vh; display:flex; flex-direction:column;
}
.board-wrap{flex:1; display:flex; align-items:center; width:100%}

/* MENU BUTTONS */
.menu-btn{
  width:100%; padding:18px; border:none; border-radius:16px;
  font-family:'Bangers',cursive; font-size:22px; letter-spacing:2px; color:#fff;
  cursor:pointer; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:12px;
  touch-action:manipulation; transition:transform .12s; position:relative; overflow:hidden;
}
.menu-btn:active{transform:scale(0.97)}
.menu-btn .ico{font-size:24px; line-height:1}
.menu-btn .lock{position:absolute; right:14px; display:flex}
.menu-btn .lock svg{width:22px; height:22px; display:block}
#btnWallet{padding:12px 44px 12px 18px; font-size:18px}
.wallet-text{display:flex; flex-direction:column; align-items:center; line-height:1.1}
.wallet-sub{font-family:'Fredoka One',cursive; font-size:10px; letter-spacing:0.5px; margin-top:3px; opacity:.95}
.wallet-sub.ok{color:#bbf7d0}
.wallet-sub.warn{color:#fde68a}
.btn-comp-green{background:linear-gradient(135deg,#16a34a,#15803d); box-shadow:0 5px 22px rgba(22,163,74,0.45)}
.btn-comp-orange{background:linear-gradient(135deg,#d97706,#b45309); box-shadow:0 5px 22px rgba(217,119,6,0.40)}
.btn-wallet{background:linear-gradient(135deg,#0ea5e9,#0284c7); box-shadow:0 5px 22px rgba(14,165,233,0.45)}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#5b21b6); box-shadow:0 5px 22px rgba(124,58,237,0.45)}

/* STATUS BAR */
.status-bar{border-radius:14px; padding:12px 14px; margin-bottom:16px; font-size:12px; line-height:1.6}
.status-bar.franc{background:rgba(22,163,74,0.15); border:1.5px solid rgba(163,230,53,0.5); color:#86efac}
.status-bar.no-franc{background:rgba(217,119,6,0.10); border:1.5px solid rgba(217,119,6,0.4); color:var(--orange-l)}
.status-bar b{color:var(--gold)}

/* LANGUAGE FLAGS */
.lang-row{display:flex; justify-content:center; gap:14px; margin-top:6px}
.flag-btn{
  width:66px; height:46px; border-radius:12px; cursor:pointer;
  border:2px solid rgba(168,85,247,0.4); background:rgba(255,255,255,0.05);
  display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden;
}
.flag-btn:active{transform:scale(0.92)}
.flag-btn.active{border-color:var(--gold); box-shadow:0 0 18px rgba(255,215,0,0.45)}
.flag-btn svg{width:48px; height:32px; border-radius:4px; display:block}

/* BACK BUTTON */
.back-btn{
  display:flex; align-items:center; gap:6px;
  background:rgba(109,40,217,0.2); border:1px solid rgba(168,85,247,0.4);
  color:#a78bfa; font-size:14px; font-family:'Fredoka One',cursive;
  cursor:pointer; padding:8px 12px; border-radius:10px; touch-action:manipulation;
}
.back-btn:active{opacity:.7}
.back-btn::before{content:'←'; font-size:18px; font-weight:bold}

/* GAME HEADER */
.game-top{display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:8px; gap:8px}
.game-top .lvl-badge{font-family:'Bangers',cursive; letter-spacing:1px; font-size:15px; color:var(--gold); flex:1; text-align:center}
.hud{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; margin-bottom:10px}
.hud .chip{background:rgba(255,255,255,0.06); border:1px solid rgba(168,85,247,0.3);
  border-radius:12px; padding:5px 12px; font-size:13px; display:flex; align-items:center; gap:6px}
.hud .chip .lab{font-size:9px; color:var(--muted); letter-spacing:.5px}
.hud .chip .num{font-family:'Bangers',cursive; font-size:17px; letter-spacing:1px}
.chip.score .num{color:var(--green-l)}
.chip.best .num{color:var(--gold)}
.chip.spec .num{color:var(--cyan); font-size:13px}

/* BOARD */
.board{
  position:relative; width:100%; max-width:420px; aspect-ratio:1; margin:0 auto;
  --gap:2.4%; --cell:calc((100% - 5*var(--gap))/4);
  background:linear-gradient(145deg,rgba(30,10,65,0.95),rgba(13,5,32,0.95));
  border:3px solid var(--purple-d); border-radius:18px;
  box-shadow:0 0 30px rgba(120,40,200,0.4); touch-action:none;
}
.cell,.tile{position:absolute; width:var(--cell); height:var(--cell); border-radius:13px}
.cell{background:rgba(255,255,255,0.045)}
.tile{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.35); overflow:hidden;
  transition:left .12s ease-out, top .12s ease-out;
}
.tile .ico{font-size:min(10vw,44px); line-height:1}
.tile img.ico{height:62%; width:auto; max-width:82%; object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.tile .lbl{font-family:'Bangers',cursive; font-size:min(3.4vw,15px); letter-spacing:1px; opacity:.8; margin-top:1px}
.tile.gold{box-shadow:0 0 18px rgba(255,215,0,0.6),0 3px 10px rgba(0,0,0,0.35)}
.tile.born{animation:born .18s ease-out}
@keyframes born{from{transform:scale(.25);opacity:0}to{transform:scale(1);opacity:1}}
.tile.pop{animation:popt .2s ease-out}
@keyframes popt{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}

/* BONUS BAR + CHAIN */
.bonus-bar{display:flex; gap:8px; justify-content:center; width:100%; max-width:420px; margin:12px auto 0}
.bonus-btn{
  background:rgba(124,58,237,0.3); border:1.5px solid rgba(168,85,247,0.4); border-radius:12px;
  padding:9px 16px; font-family:'Fredoka One',cursive; font-size:12px; color:#fff;
  cursor:pointer; touch-action:manipulation;
}
.bonus-btn:active{transform:scale(0.93)}
.bonus-btn:disabled{opacity:.3}
.chain{display:flex; flex-wrap:nowrap; gap:3px; justify-content:center; align-items:center; max-width:420px; margin:14px auto 0}
.chain span{font-size:min(4.6vw,19px); filter:grayscale(1); opacity:.28; transition:filter .3s,opacity .3s}
.chain span.got{filter:none; opacity:1; text-shadow:0 0 10px rgba(255,215,0,.5)}
.chain span.arw{font-size:min(2.4vw,10px); color:var(--muted); filter:none; opacity:.45}

/* CLASSEMENT (même construction que Chicken Reflex / Chicken Blast) */
#btnBoard{font-size:17px; padding:14px 18px; line-height:1.2; text-align:center}
.sec-title{font-family:'Bangers',cursive; font-size:24px; letter-spacing:2px; color:var(--purple); text-align:center; margin-bottom:6px}
.sec-sub{font-size:11px; color:var(--muted); text-align:center; margin-bottom:16px; line-height:1.5}
.summary-box{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
.sum-card{background:rgba(255,255,255,0.05); border:1px solid rgba(168,85,247,0.28);
  border-radius:13px; padding:10px 8px; text-align:center; display:flex; flex-direction:column; gap:1px}
.sum-card.top{border-color:rgba(255,215,0,0.55); background:linear-gradient(145deg,rgba(255,215,0,0.14),rgba(217,119,6,0.10))}
.sum-card.me{border-color:rgba(34,197,94,0.5); background:linear-gradient(145deg,rgba(22,163,74,0.20),rgba(21,128,61,0.14))}
.sum-card.me.none{border-color:rgba(168,85,247,0.28); background:rgba(255,255,255,0.04)}
.sum-card .cap{font-size:9px; color:var(--muted); letter-spacing:.5px}
.sum-card b{font-family:'Bangers',cursive; font-size:20px; letter-spacing:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sum-card.top b{color:var(--gold)}
.sum-card.me b{color:var(--green-l)}
.sum-card .pt{font-size:11px}
.sum-card .sp{font-size:9px; color:var(--muted)}
.sum-players{grid-column:1/-1; text-align:center; font-size:10px; color:var(--muted)}
.sum-empty{grid-column:1/-1; text-align:center; padding:6px; color:var(--muted); font-size:12px}
.scores-box{margin-top:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(168,85,247,0.25); border-radius:14px; padding:14px}
.scores-box .sh{font-family:'Bangers',cursive; letter-spacing:1px; color:var(--gold); font-size:16px; margin-bottom:10px; text-align:center}
.score-row{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; margin-bottom:6px; font-size:13px; background:rgba(255,255,255,0.03)}
.score-row.me{background:rgba(168,85,247,0.22); border:1px solid rgba(192,132,252,0.5)}
.score-row .rank{font-family:'Bangers',cursive; font-size:18px; width:30px; flex:0 0 auto}
.score-row.r1 .rank{color:#FFD700}.score-row.r2 .rank{color:#d1d5db}.score-row.r3 .rank{color:#cd7f32}
.score-row .who{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.score-row .val{font-family:'Bangers',cursive; letter-spacing:1px; color:var(--green-l); font-size:16px}
.score-row .meta{font-size:10px; color:var(--muted); width:64px; text-align:right; flex:0 0 auto}
.score-gap{text-align:center; color:var(--muted); font-size:18px; letter-spacing:4px; padding:2px 0 4px; opacity:.7}
.no-scores{text-align:center; color:var(--muted); font-size:12px; padding:8px; line-height:1.6}
.modal .invite{font-size:11px; color:var(--muted); margin:-6px 0 14px; line-height:1.5}

/* OVERLAY / MODAL / TOAST */
.overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
  padding:24px; background:rgba(5,2,15,0.82); backdrop-filter:blur(6px)}
.overlay.show{display:flex; animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  width:100%; max-width:340px; text-align:center;
  background:linear-gradient(145deg,rgba(13,5,32,0.98),rgba(30,10,65,0.98));
  border:2px solid rgba(180,100,255,0.4); border-radius:24px; padding:26px 22px;
  box-shadow:0 0 60px rgba(120,40,200,0.5); animation:pop .3s cubic-bezier(.2,1.4,.5,1)
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal img{width:120px; height:120px; object-fit:contain; margin-bottom:10px; filter:drop-shadow(0 6px 16px rgba(0,0,0,0.6))}
.modal h2{font-family:'Bangers',cursive; font-size:30px; letter-spacing:2px; margin-bottom:8px}
.modal h2.win{color:var(--gold); text-shadow:0 0 20px rgba(255,215,0,0.5)}
.modal h2.lose{color:#fca5a5; text-shadow:0 0 20px rgba(239,68,68,0.4)}
.modal h2.locked{color:var(--orange-l)}
.modal p{font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:18px}
.modal p b{color:var(--gold)}
.modal .modal-score{font-family:'Bangers',cursive; font-size:26px; color:var(--green-l); margin:6px 0 14px; letter-spacing:1px}
.modal .mbtn{width:100%; padding:14px; border:none; border-radius:14px; margin-bottom:10px;
  font-family:'Bangers',cursive; font-size:18px; letter-spacing:1px; color:#fff; cursor:pointer}
.modal .mbtn:active{transform:scale(0.96)}
.toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(124,58,237,0.95); color:#fff; padding:12px 18px; border-radius:14px;
  font-size:13px; z-index:70; opacity:0; transition:opacity .25s,transform .25s; max-width:90%;
  text-align:center; box-shadow:0 6px 24px rgba(0,0,0,0.5); pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
</head>

async function detectHolder(){
  if(tg?.initData){
    try{
      const res = await fetch(BACKEND+'/check-franc',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({initData:tg.initData})
      });
      const d = await res.json();
      walletLinked = !!(d && d.walletLinked);
      isHolder = !!(d && (d.unlocked ?? (d.walletLinked && d.hasFranc)));
      unlockReason = (d && d.reason) || (isHolder ? 'solana' : null);
      francBalance = isHolder ? Number(d.balance || 0) : 0;
      localStorage.setItem('flc_holder',JSON.stringify(isHolder));
      localStorage.setItem('flc_balance',String(francBalance));
      localStorage.setItem('flc_walletLinked',JSON.stringify(walletLinked));
      localStorage.setItem('flc_reason', unlockReason || '');
    }catch(e){/* keep cached */}
  }
  renderWalletStatus(); renderStatusBar();
}

/* ============================================================
   CLASSEMENT MONDIAL DU MODE DORÉ
   Construction reprise telle quelle de Chicken Blast : une seule Edge
   Function, un joueur = une ligne, et le minimum d'appels Supabase —
   AUCUN au démarrage, une lecture à l'ouverture du classement, une
   écriture seulement quand le record est battu. La réponse de l'écriture
   contient déjà le classement à jour, donc pas de second appel.
   ============================================================ */
const SCORES_EP = BACKEND + '/eggsponential-scores';
const MEDALS=['🥇','🥈','🥉'];
let board=null;            // {top:[], me:{}|null, total:N} renvoyé par le serveur
let boardState='idle';     // 'idle' | 'loading' | 'ok' | 'error'

const fmt = n => Number(n||0).toLocaleString(lang==='fr'?'fr-FR':'en-GB');
const esc = s => String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const species = tile => t('names')[tierOf(tile||2)];

async function callScores(action, extra){
  const body={action, ...extra};
  if(tg?.initData) body.initData=tg.initData;   // l'identité est dérivée côté serveur
  const res=await fetch(SCORES_EP,{
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  return await res.json();
}

/* Le SEUL écran qui déclenche une lecture du classement, à son ouverture. */
function openBoard(){ show('screenBoard'); loadBoard(); }
async function loadBoard(){
  if(boardState==='loading') return;
  boardState='loading'; renderScores();
  try{
    const d=await callScores('top');
    if(!d?.ok) throw new Error(d?.error||'ko');
    board=d; boardState='ok';
    syncMyBestFromServer(d.me);   // le serveur fait foi
  }catch(e){ boardState='error'; }
  renderScores();
}

/* Fin de partie en Mode Doré : on n'appelle Supabase QUE si le record est
   battu. Une partie ordinaire ne déclenche donc aucun appel. */
async function submitRun(score, tile, moves){
  setMyBest(score, tile);                 // record local, toujours
  if(!tg?.initData) return false;         // hors Telegram : aucune identité signée
  try{
    const d=await callScores('submit',{score, best_tile:tile, moves});
    if(!d?.ok) throw new Error(d?.error||'ko');
    board=d; boardState='ok';             // la réponse contient déjà le classement
    syncMyBestFromServer(d.me);
    return true;
  }catch(e){ boardState='error'; return false; }
}

/* ---- Record perso, gardé en local ----
   C'est lui qui décide s'il faut appeler Supabase en fin de partie. Le serveur
   revérifie de son côté (il ne garde que le meilleur), donc un localStorage
   vide ou un autre appareil ne peut pas écraser un meilleur score par erreur. */
function getMyBest(){ try{ return JSON.parse(localStorage.getItem('flce_myBest'))||null; }catch(e){ return null; } }
function better(score,tile,b){ return !b || score>b.score || (score===b.score && tile>(b.tile||0)); }
function setMyBest(score,tile){
  if(better(score,tile,getMyBest())) localStorage.setItem('flce_myBest',JSON.stringify({score,tile,date:Date.now()}));
}
function isRecord(score,tile){ return better(score,tile,getMyBest()); }
/* Le serveur fait foi : on resynchronise le record local à chaque lecture. */
function syncMyBestFromServer(me){
  if(!me) return;
  if(better(me.score, me.tile, getMyBest()))
    localStorage.setItem('flce_myBest',JSON.stringify({score:me.score, tile:me.tile, date:Date.now()}));
  renderMyBest();
}

/* Sous le bouton du menu : le meilleur du joueur, lu en local — donc affiché
   sans le moindre appel réseau au démarrage. */
function renderMyBest(){
  const box=document.getElementById('boardSum'); if(!box) return;
  const b=getMyBest();
  box.textContent = b ? t('myBest').replace('%S',fmt(b.score)).replace('%E',species(b.tile)) : t('noBest');
}

function renderScores(){
  const sum=document.getElementById('boardSummary'), list=document.getElementById('board'),
        st=document.getElementById('boardState');
  if(boardState==='loading'){ sum.innerHTML=''; list.innerHTML=''; st.textContent=t('loading'); return; }
  if(boardState==='error'){ sum.innerHTML=''; list.innerHTML=''; st.textContent=t('boardFail'); return; }
  const rows=board?.top||[];
  if(!rows.length){ sum.innerHTML=''; list.innerHTML=''; st.textContent=t('noScores').replace('\n',' '); return; }
  const champ=rows[0], me=board.me;
  sum.innerHTML=`<div class="sum-card top"><span class="cap">🥇 ${t('champion')}</span>
      <b>${esc(champ.name)}</b><span class="pt">${fmt(champ.score)}</span>
      <span class="sp">${species(champ.tile)}</span></div>
    ${me ? `<div class="sum-card me"><span class="cap">${t('yourBest')}</span>
      <b>#${me.rank}</b><span class="pt">${fmt(me.score)}</span>
      <span class="sp">${species(me.tile)}</span></div>`
    : `<div class="sum-card me none"><span class="cap">${t('yourBest')}</span>
      <b>—</b><span class="pt">${t('notPlayed')}</span></div>`}
    <div class="sum-players">${board.total} ${t('playersTotal')}</div>`;
  let html=rows.map(scoreRow).join('');
  // Joueur hors du TOP : petits points, puis sa ligne juste en dessous.
  if(me && !rows.some(r=>r.me)) html+=`<div class="score-gap">⋯</div>`+scoreRow({...me, me:true});
  list.innerHTML=html; st.textContent='';
}
function scoreRow(r){
  return `<div class="score-row r${r.rank} ${r.me?'me':''}">
      <span class="rank">${MEDALS[r.rank-1]||'#'+r.rank}</span>
      <span class="who">${esc(r.name)}</span>
      <span class="val">${fmt(r.score)}</span>
      <span class="meta">${species(r.tile)}</span>
    </div>`;
}

/* Fin d'une partie en Mode Doré : au plus une écriture, et seulement sur record. */
async function pushScore(){
  if(!golden || !grid) return;
  let top=0; grid.forEach(row=>row.forEach(t=>{ if(t&&t.v>top) top=t.v; }));
  if(!top || !isRecord(score,top)) return;      // pas de record = pas d'appel Supabase
  const invite=document.getElementById('modalInvite');
  if(!tg?.initData){                            // hors Telegram : record gardé en local
    setMyBest(score,top); renderMyBest();
    if(invite) invite.textContent=t('tgOnly');
    return;
  }
  const ok=await submitRun(score,top,moves);
  renderMyBest();
  if(!invite) return;
  if(!ok){ invite.textContent=t('sendFail'); invite.style.color='#fca5a5'; return; }
  invite.textContent = board?.me
    ? t('rankLine').replace('%N',board.me.rank).replace('%T',board.total)
    : t('sendOk');
}

/* ============================================================
   GAME — classic 4×4 2048
   ============================================================ */
const N=4;
const elTiles=document.getElementById('tiles'), elCells=document.getElementById('cells');
let grid, els=new Map(), uid=0, score=0, moves=0, golden=false, undos=0, hist=null, over=false, wonFlag=false, ghosts=[];
let best=Number(localStorage.getItem('flc_2048Best')||0);
let seenMax=Number(localStorage.getItem('flc_2048Seen')||0);

for(let r=0;r<N;r++) for(let c=0;c<N;c++){
  const d=document.createElement('div'); d.className='cell'; place(d,r,c); elCells.appendChild(d);
}
function place(el,r,c){
  el.style.left=`calc(var(--gap) + ${c} * (var(--cell) + var(--gap)))`;
  el.style.top =`calc(var(--gap) + ${r} * (var(--cell) + var(--gap)))`;
}
function tierOf(v){ return Math.min(Math.log2(v)-1, TIERS.length-1); }

function startGame(g){
  if(g && !isHolder){ showLockModal(); return; }
  golden=g; show('screenGame'); restart();
}
function restart(){
  closeModal();
  grid=Array.from({length:N},()=>Array(N).fill(null));
  score=0; moves=0; over=false; wonFlag=false; hist=null; ghosts=[];
  undos = golden?3:0;
  elTiles.innerHTML=''; els.clear();
  addRandom(); addRandom(); render(); renderHud(); renderChain();
  document.getElementById('gameMode').textContent = golden ? t('modeGolden') : t('modeClassic');
}
/* Quitter en cours de partie compte aussi : le score part s'il bat le record. */
function quitGame(){ pushScore(); show('screenMenu'); }
function addRandom(){
  const free=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!grid[r][c]) free.push([r,c]);
  if(!free.length) return;
  const [r,c]=free[Math.random()*free.length|0];
  grid[r][c]={id:++uid, v:Math.random()<0.9?2:4, born:true};
}
function render(){
  const alive=new Set();
  ghosts.forEach(g=>{
    const el=els.get(g.id); alive.add(g.id);
    if(el){ el.style.zIndex=1; place(el,g.r,g.c); setTimeout(()=>{ el.remove(); els.delete(g.id); },130); }
  });
  ghosts=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const t=grid[r][c]; if(!t) continue;
    alive.add(t.id);
    let el=els.get(t.id);
    if(!el){ el=document.createElement('div'); el.className='tile'; els.set(t.id,el); elTiles.appendChild(el); place(el,r,c); }
    else place(el,r,c);
    const T=TIERS[tierOf(t.v)];
    el.style.background=T.bg; el.style.color=T.fg; el.classList.toggle('gold',!!T.gold); el.style.zIndex=2;
    el.innerHTML = (T.img?`<img class="ico" src="${IMG.coq}" alt="">`:`<span class="ico">${T.ico}</span>`)+`<span class="lbl">${t.v}</span>`;
    if(t.born){ t.born=false; el.classList.add('born'); setTimeout(()=>el.classList.remove('born'),200); }
    if(t.pop){ t.pop=false; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  els.forEach((el,id)=>{ if(!alive.has(id)){ el.remove(); els.delete(id); } });
}
/* traversal lines, ordered from the destination edge inward */
function lines(dir){
  const L=[];
  for(let i=0;i<N;i++){
    const l=[];
    for(let j=0;j<N;j++){
      if(dir===3) l.push([i,j]); else if(dir===1) l.push([i,N-1-j]);
      else if(dir===0) l.push([j,i]); else l.push([N-1-j,i]);
    }
    L.push(l);
  }
  return L;
}
function move(dir){
  if(over) return;
  const snap={g:grid.map(row=>row.map(t=>t?{...t}:null)), s:score, m:moves};
  let moved=false, gained=0;
  lines(dir).forEach(line=>{
    const src=line.map(([r,c])=>grid[r][c]).filter(Boolean), out=[], eaten=[];
    src.forEach(t=>{
      const last=out[out.length-1];
      if(last && !last._m && last.v===t.v){
        last.v*=2; last._m=true; last.pop=true; gained+=last.v;
        eaten.push({id:t.id, i:out.length-1});
      } else out.push(t);
    });
    line.forEach(([r,c],i)=>{
      const b=grid[r][c], a=out[i]||null;
      if((b?b.id:0)!==(a?a.id:0)) moved=true;
      grid[r][c]=a;
    });
    eaten.forEach(e=>ghosts.push({id:e.id, r:line[e.i][0], c:line[e.i][1]}));
  });
  grid.forEach(row=>row.forEach(t=>{ if(t) delete t._m; }));
  if(!moved){ ghosts=[]; return; }
  hist=snap;
  moves++;
  score += golden ? gained*2 : gained;
  addRandom(); render();
  haptic(gained?'medium':'light');
  checkState();
}
function canMove(){
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const t=grid[r][c];
    if(!t) return true;
    if(c<N-1 && grid[r][c+1] && grid[r][c+1].v===t.v) return true;
    if(r<N-1 && grid[r+1][c] && grid[r+1][c].v===t.v) return true;
  }
  return false;
}
function checkState(){
  let top=0; grid.forEach(row=>row.forEach(t=>{ if(t&&t.v>top) top=t.v; }));
  const tier=tierOf(top);
  if(tier>seenMax){ seenMax=tier; localStorage.setItem('flc_2048Seen',String(seenMax));
    toast(`${t('newSpecies')} <b>${t('names')[tier]}</b>`); haptic('heavy'); }
  if(score>best){ const wasBelow=best; best=score; localStorage.setItem('flc_2048Best',String(best));
    if(wasBelow>0 && !over) { const el=document.getElementById('toast'); if(!el.classList.contains('show')) toast(t('newRecord')); } }
  renderHud(); renderChain();
  if(top>=2048 && !wonFlag){
    wonFlag=true;
    modal(`<img src="${IMG.coeur}" alt=""><h2 class="win">👑 ${t('win')}</h2><p>${t('winText')}</p>
      <div class="modal-score">${fmt(score)}</div>
      <button class="mbtn btn-comp-green" onclick="closeModal()">${t('keepGoing')}</button>
      <button class="mbtn btn-purple" onclick="restart()">🔄 ${t('replay')}</button>`);
    return;
  }
  if(!canMove()){
    over=true;
    modal(`<img src="${IMG.triste}" alt=""><h2 class="lose">${t('gameOver')}</h2><p>${t('goText')}</p>
      <div class="modal-score">${fmt(score)}</div>
      ${golden?`<p class="invite" id="modalInvite"></p>`:''}
      <button class="mbtn btn-comp-green" onclick="restart()">🔄 ${t('replay')}</button>
      ${golden?`<button class="mbtn btn-wallet" onclick="closeModal();openBoard()">${t('seeBoard')}</button>`:''}
      <button class="mbtn btn-purple" onclick="closeModal();show('screenMenu')">${t('toMenu')}</button>`);
    pushScore();   // n'ecrit dans Supabase que si c'est un record
  }
}
function undo(){
  if(!hist || undos<=0) return;
  grid=hist.g; score=hist.s; moves=hist.m; hist=null; undos--; over=false; ghosts=[];
  elTiles.innerHTML=''; els.clear();
  grid.forEach(row=>row.forEach(t=>{ if(t){ t.born=false; t.pop=false; } }));
  render(); renderHud();
}
function renderHud(){
  if(!grid) return;
  let top=0; grid.forEach(row=>row.forEach(t=>{ if(t&&t.v>top) top=t.v; }));
  document.getElementById('hud').innerHTML=`
    <div class="chip score"><span class="lab">${t('score')}</span><span class="num">${fmt(score)}</span></div>
    <div class="chip best"><span class="lab">${t('best')}</span><span class="num">${fmt(best)}</span></div>
    <div class="chip spec"><span class="lab">${t('spec')}</span><span class="num">${t('names')[tierOf(top||2)]}</span></div>`;
  const u=document.getElementById('btnUndo');
  u.classList.toggle('hidden', !golden);
  u.disabled = undos<=0 || !hist;
  u.querySelector('span').textContent = `${t('undo')} (${undos})`;
  document.getElementById('gameMode').textContent = golden ? t('modeGolden') : t('modeClassic');
}
function renderChain(){
  const box=document.getElementById('chain'); box.innerHTML='';
  TIERS.forEach((T,i)=>{
    if(i) box.insertAdjacentHTML('beforeend','<span class="arw">▸</span>');
    const s=document.createElement('span');
    s.className = i<=seenMax ? 'got':'';
    s.textContent = T.img?'👑':T.ico;
    s.title = t('names')[i];
    box.appendChild(s);
  });
}

/* ---------- Controls ---------- */
const KM={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};
document.addEventListener('keydown',e=>{ if(KM[e.key]!==undefined){ move(KM[e.key]); e.preventDefault(); } });
const boardEl=document.getElementById('board');   // le plateau (`board` = le classement)
let ts=null;
boardEl.addEventListener('touchstart',e=>{ const p=e.touches[0]; ts={x:p.clientX,y:p.clientY}; e.preventDefault(); },{passive:false});
boardEl.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
boardEl.addEventListener('touchend',e=>{
  if(!ts) return;
  const p=e.changedTouches[0], dx=p.clientX-ts.x, dy=p.clientY-ts.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>=22) move(Math.abs(dx)>Math.abs(dy) ? (dx>0?1:3) : (dy>0?2:0));
  ts=null; e.preventDefault();
},{passive:false});

/* ---------- Init ---------- */
function init(){
  if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
  setLang(lang);
  detectHolder();
}
init();
</script>
